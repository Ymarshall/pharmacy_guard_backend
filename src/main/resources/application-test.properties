spring.datasource.url=jdbc:h2:mem:pharmacie;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.flyway.enabled=false
google.vision.enabled=false
google.maps.api.key=
app.jwt.secret=test-jwt-secret-must-be-at-least-32-characters
app.swagger.enabled=true
app.security.login-max-attempts=5
app.security.login-window-seconds=60
server.error.include-stacktrace=never
