spring.application.name=pharmaciegarde

# Configuration Base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmacy_guarde_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
# IMPORTANT: Utilisez 'update' pour le développement, mais pour la migration de schema majeur,
# il est recommandé d'exécuter le script SQL manuellement (voir migration_duties_table.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
# Forcer Hibernate à recréer les colonnes manquantes (à utiliser avec précaution)
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# Configuration Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.show-actuator=false

# Configuration upload de fichiers
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/duty-files
file.extraction-dir=uploads/extractions

# Configuration Google Vision API (optionnel pour OCR)
google.vision.enabled=true
# Chemin vers le fichier JSON de credentials Google Cloud (compte de service)
# PRIORITÉ 1 : Variable d'environnement GOOGLE_APPLICATION_CREDENTIALS (recommandé pour production)
# PRIORITÉ 2 : Fichier dans src/main/resources/ (fallback pour développement)
# Placez votre fichier JSON dans src/main/resources/pharmacie-guarde-26c4adebd2b7.json
google.vision.credentials.path=pharmacie-guarde-26c4adebd2b7.json

# Configuration Google Maps API pour le géocodage
# Obtenez votre clé API sur: https://console.cloud.google.com/google/maps-apis/credentials
# IMPORTANT: Configurez cette clé via une variable d'environnement GOOGLE_MAPS_API_KEY pour la production
# ATTENTION: Ne commitez JAMAIS cette clé dans le dépôt Git en production !
google.maps.api.key=${GOOGLE_MAPS_API_KEY:AIzaSyCSoCyTCT0rK2BjnPFaIUug0o5aqS-NOWM}
