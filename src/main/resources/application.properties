spring.application.name=pharmaciegarde

# Secrets : variables d'environnement uniquement. Voir .env.example.
# Ne jamais remettre de mot de passe, de clé Google ou de secret JWT dans ce fichier.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pharmacy_guarde_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate complète le schéma ; Flyway pose les index et colonnes additives (baseline).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.auto=${JPA_DDL_AUTO:update}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Swagger : ouvert en local, coupé par le profil prod (SWAGGER_ENABLED=false)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
app.swagger.enabled=${SWAGGER_ENABLED:true}

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript
server.compression.min-response-size=1024
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads/duty-files}
file.extraction-dir=${FILE_EXTRACTION_DIR:uploads/extractions}

# Google Vision : activer explicitement et fournir le fichier hors dépôt.
google.vision.enabled=${GOOGLE_VISION_ENABLED:false}
google.vision.credentials.path=${GOOGLE_VISION_CREDENTIALS_PATH:}

# Clé Maps uniquement via l'environnement. Aucune valeur par défaut.
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://127.0.0.1:4200}
app.security.login-max-attempts=${LOGIN_MAX_ATTEMPTS:10}
app.security.login-window-seconds=${LOGIN_WINDOW_SECONDS:60}
app.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# LLM vision optionnel. Google Vision reste le moteur par défaut.
app.vision.llm.enabled=${LLM_VISION_ENABLED:false}
app.vision.llm.base-url=${LLM_VISION_BASE_URL:}
app.vision.llm.api-key=${LLM_VISION_API_KEY:}
app.vision.llm.model=${LLM_VISION_MODEL:gpt-4o-mini}

# Fenêtre de garde : [startDate à l'heure de relève, endDate+1 jour à l'heure de relève).
app.duty.zone=${DUTY_ZONE:Africa/Abidjan}
app.duty.handover-time=${DUTY_HANDOVER_TIME:08:00}

# Seed du catalogue embarqué. Désactivé par défaut pour ne pas réinjecter d'anciennes pharmacies.
app.seed.pharmacies.enabled=${SEED_PHARMACIES_ENABLED:false}
